[project]
name = "secondself"
version = "0.2.0"
description = "SecondSelf — Your Personal AI Second Brain"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "click>=8.1",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "groq>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rich>=13.0",
    "streamlit>=1.35",
    "streamlit-agraph>=0.0.45",
]

[project.optional-dependencies]
# Heavy ML deps — only needed for CLI file capture (OCR, audio, video)
media = [
    "openai-whisper>=20231117",
    "easyocr>=1.7",
    "moviepy>=1.0.3",
]

[project.scripts]
secondself = "secondself.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
