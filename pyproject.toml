[project]
name = "secondself"
version = "0.1.0"
description = "SecondSelf — Your Personal AI Second Brain"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "click>=8.1",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "groq>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rich>=13.0",
]

[project.scripts]
secondself = "secondself.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
